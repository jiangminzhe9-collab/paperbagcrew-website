<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>選擇居民體型 | Paperbagcrew World</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f0ed;color:#151515;font-family:system-ui,-apple-system,sans-serif}.shell{max-width:1180px;margin:auto;padding:26px 18px 50px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}header a{color:#333;text-decoration:none}h1{font-size:clamp(27px,5vw,54px);font-weight:1000;letter-spacing:-2px;margin:0;transform:skew(-6deg)}.sub{letter-spacing:.35em;font-size:13px;margin:2px 0 24px}.intro{margin:18px 0 22px;color:#444}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.character{border:2px solid #d7d3cc;background:linear-gradient(155deg,#fff,#e8e4df);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;padding:14px 6px 12px;text-align:center;color:#222}.character[aria-pressed=true]{border:3px solid #161616;box-shadow:0 0 0 4px #e5bd63}.character h2{background:#242424;color:white;display:inline-block;padding:8px 15px;border-radius:7px;margin:0;font-size:clamp(16px,2.3vw,24px)}.character p{margin:7px 0;font-size:13px}.character svg{width:100%;max-width:310px;height:auto;display:block;margin:auto}.selected{font-size:13px;font-weight:800;min-height:22px}.form{margin:24px auto 0;max-width:520px;background:#fff;padding:20px;border:1px solid #d5d0c9;border-radius:15px}label{font-weight:750;display:block;margin-bottom:9px}input{width:100%;padding:15px;font:inherit;border:1px solid #aaa;border-radius:8px}#continue{background:#181818;color:#fff;border:0;border-radius:9px;width:100%;padding:16px;font-size:17px;font-weight:800;margin-top:14px;cursor:pointer}#continue:disabled{opacity:.4;cursor:not-allowed}.note{color:#666;font-size:13px;line-height:1.5}#message{font-weight:700;color:#34583a}@media(max-width:680px){.cards{gap:6px}.character{padding:8px 2px}.character h2{font-size:13px;padding:6px}.character p{font-size:11px}.shell{padding:18px 8px}h1{font-size:30px}.sub{font-size:10px}}</style></head><body><main class="shell"><header><div><h1>PAPERBAGCREW</h1><div class="sub">STICKMAN BASE MODEL</div></div><a href="/">← WORLD</a></header><div class="intro"><strong>第一階段｜選擇居民基礎體型</strong><div class="note">初始角色只有原色紙袋頭與黑色素體。選擇體型不限制未來的服裝與配件。</div></div><div class="cards" id="cards"></div><section class="form"><label for="nick">居民暱稱 / Resident nickname</label><input id="nick" maxlength="24" placeholder="輸入你的暱稱" autocomplete="nickname"><button id="continue" disabled>確認角色，進入第二階段 →</button><p class="note">目前只建立第一階段角色資料；第二階段免費裝備尚未開放。資料僅儲存在此瀏覽器。</p><p id="message" aria-live="polite"></p></section></main><script>
const data=[["male","男性 Male","標準體型"],["female","女性 Female","纖細體型"],["neutral","中性 Neutral","中性體型"]];let chosen=localStorage.getItem("pbc-base-type")||"";const nick=document.getElementById("nick");nick.value=localStorage.getItem("pbc-nickname")||"";
function figure(type){let waist=type==="female"?[127,173]:type==="male"?[117,183]:[122,178],shoulder=type==="female"?[121,179]:type==="male"?[112,188]:[117,183];return `<svg viewBox="0 0 300 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="紙袋人正面角色"><defs><linearGradient id="paper-${type}" x1="0" x2="1" y1="0" y2=".3"><stop stop-color="#d2a06b"/><stop offset=".5" stop-color="#e5bb84"/><stop offset="1" stop-color="#b98048"/></linearGradient><linearGradient id="body-${type}" x1="0" x2="1"><stop stop-color="#101012"/><stop offset=".48" stop-color="#363637"/><stop offset="1" stop-color="#111113"/></linearGradient></defs><ellipse cx="150" cy="390" rx="86" ry="8" fill="#777" opacity=".16"/><g fill="url(#body-${type})" stroke="#171719" stroke-width="2"><path d="M${waist[0]} 228 L145 229 L143 354 Q135 366 119 357 L${waist[0]-6} 256Z"/><path d="M155 229 L${waist[1]} 228 L${waist[1]+6} 256 L181 357 Q166 367 157 354Z"/><path d="M${shoulder[0]} 169 Q150 154 ${shoulder[1]} 169 L${waist[1]} 254 Q150 267 ${waist[0]} 254Z"/><path d="M${shoulder[0]+2} 176 Q99 206 94 277" fill="none" stroke="url(#body-${type})" stroke-width="19" stroke-linecap="round"/><path d="M${shoulder[1]-2} 176 Q201 206 206 277" fill="none" stroke="url(#body-${type})" stroke-width="19" stroke-linecap="round"/><ellipse cx="92" cy="282" rx="16" ry="22"/><ellipse cx="208" cy="282" rx="16" ry="22"/><path d="M116 351 Q96 360 93 379 Q95 387 120 386 L146 385 L146 363Z"/><path d="M184 351 Q204 360 207 379 Q205 387 180 386 L154 385 L154 363Z"/></g><path d="M89 45 L205 43 L216 159 L85 162Z" fill="url(#paper-${type})" stroke="#ad7945" stroke-width="1.8"/><path d="M89 45 L107 64 L85 162 M205 43 L191 65 L216 159 M107 64 L191 65" fill="none" stroke="#aa7848" stroke-width="2" opacity=".6"/><path d="M89 45 L97 53 L110 45 M202 45 L211 55" stroke="#f3d2a0" stroke-width="4" opacity=".65"/><ellipse cx="124" cy="105" rx="13" ry="20" fill="#111"/><ellipse cx="175" cy="105" rx="13" ry="20" fill="#111"/><text x="179" y="147" font-size="22" font-family="system-ui" font-style="italic" font-weight="1000" transform="rotate(-15 179 147)">DZ</text><rect x="211" y="142" width="7" height="21" fill="#c43e32"/><text x="216" y="158" transform="rotate(-90 216 158)" fill="white" font-size="5">DZ</text></svg>`}
function render(){document.getElementById("cards").innerHTML=data.map(([id,title,subtitle])=>`<button class="character" data-type="${id}" aria-pressed="${chosen===id}"><h2>${title}</h2><p>${subtitle}</p>${figure(id)}<div class="selected">${chosen===id?"✓ 已選擇 / SELECTED":"正面 FRONT"}</div></button>`).join("");document.getElementById("continue").disabled=!chosen||!nick.value.trim()}document.getElementById("cards").addEventListener("click",e=>{let b=e.target.closest("[data-type]");if(b){chosen=b.dataset.type;render()}});nick.addEventListener("input",render);document.getElementById("continue").addEventListener("click",()=>{localStorage.setItem("pbc-base-type",chosen);localStorage.setItem("pbc-nickname",nick.value.trim());document.getElementById("message").textContent="✓ 第一階段已儲存。第二階段免費裝備選擇即將開放。"});render();</script></body></html>
